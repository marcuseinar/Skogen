name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/wasm-game-github-pages-82ky5v"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM (release)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/skogen.wasm dist/skogen.wasm
          cp index.html dist/index.html
          # Use the JS bundle committed to the repo (avoids external network fetch)
          cp mq_js_bundle.js dist/mq_js_bundle.js
          cp sprites.png dist/sprites.png

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
